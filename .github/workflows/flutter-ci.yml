name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, test, and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify committed Android/iOS scaffold
        shell: bash
        run: |
          required_paths=(
            android/settings.gradle.kts
            ios/Runner.xcodeproj/project.pbxproj
            pubspec.lock
          )
          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "::error::Required committed project file '$path' is missing. Restore the Flutter scaffold and commit the file."
              exit 1
            fi
          done

      - name: Resolve dependencies from the committed lockfile
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart and Flutter code
        run: flutter analyze --fatal-infos

      - name: Run widget tests with coverage
        run: flutter test --coverage

      - name: Build Android debug APK
        run: flutter build apk --debug

  ios:
    name: Build iOS application
    # Pin the macOS image to keep the Xcode toolchain from changing implicitly.
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify committed Android/iOS scaffold
        shell: bash
        run: |
          required_paths=(
            android/settings.gradle.kts
            ios/Runner.xcodeproj/project.pbxproj
            pubspec.lock
          )
          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "::error::Required committed project file '$path' is missing. Restore the Flutter scaffold and commit the file."
              exit 1
            fi
          done

      - name: Resolve dependencies from the committed lockfile
        run: flutter pub get --enforce-lockfile

      - name: Build iOS without code signing
        run: flutter build ios --no-codesign
