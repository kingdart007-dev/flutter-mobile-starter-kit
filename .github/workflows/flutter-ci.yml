name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, test, and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native platform scaffolding when absent
        shell: bash
        run: |
          if [[ ! -d android || ! -d ios ]]; then
            flutter create \
              --platforms=android,ios \
              --project-name=flutter_mobile_starter_kit \
              --org=com.kingdart \
              --no-pub \
              .
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # A one-day artifact preserves the exact Dart formatter output and
      # Flutter-generated mobile scaffold if an early quality gate fails.
      # It makes remediation evidence-based without weakening the CI gate.
      - name: Export generated scaffold for remediation
        if: failure()
        shell: bash
        run: |
          dart format lib test
          tar -czf "${RUNNER_TEMP}/starter-scaffold.tar.gz" \
            lib test android ios pubspec.yaml pubspec.lock \
            analysis_options.yaml .gitignore README.md

      - name: Upload generated scaffold for remediation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: starter-scaffold-remediation
          path: ${{ runner.temp }}/starter-scaffold.tar.gz
          retention-days: 1

      - name: Analyze Dart and Flutter code
        run: flutter analyze --fatal-infos

      - name: Run widget tests with coverage
        run: flutter test --coverage

      - name: Build Android debug APK
        run: flutter build apk --debug

  ios:
    name: Build iOS application
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project scaffolding when absent
        shell: bash
        run: |
          if [[ ! -d ios ]]; then
            flutter create \
              --platforms=ios \
              --project-name=flutter_mobile_starter_kit \
              --org=com.kingdart \
              --no-pub \
              .
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS without code signing
        run: flutter build ios --no-codesign
